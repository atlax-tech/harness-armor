name: Skill specification and quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Skill specification, evals, references, and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm test
      - run: npm run lint:markdown
      - name: Inspect npm package payload
        run: npm pack --dry-run --json
