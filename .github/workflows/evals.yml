name: Trigger and workflow eval contracts

on:
  push:
    paths:
      - "skills/**"
      - "shared/evals/**"
      - "tests/evals/**"
      - ".github/workflows/evals.yml"
  pull_request:
    paths:
      - "skills/**"
      - "shared/evals/**"
      - "tests/evals/**"
      - ".github/workflows/evals.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run test:skills
      - run: npm run test:evals
      - name: Explain live-client boundary
        run: node -e "console.log('Corpus and deterministic graders passed. Real Claude/Codex trigger smoke tests remain a release gate requiring authenticated clients.')"
